[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roof-analysis"
version = "1.0.0"
description = "Rooftop detection and attribute extraction by fusing a georeferenced orthophoto with open building footprints."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "rasterio>=1.4,<2.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "requests>=2.32,<3.0",
]

[project.scripts]
roof-analysis = "roof_analysis.__main__:main"
roof-analysis-download-samples = "roof_analysis.sample_download:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
files = ["src/roof_analysis"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
